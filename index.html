    <!-- Self-heal watchdog: if the app bundle fails to boot (stale/broken
         service-worker state in the browser profile), the splash stays on
         screen. After 25s, purge service workers + caches once and reload,
         which restores a clean direct load. Guarded to once per session. -->
    <script>
      (function () {
        try {
          setTimeout(function () {
            if (!document.getElementById("ug-splash")) return;
            try { if (sessionStorage.getItem("ug-heal-v1")) return; sessionStorage.setItem("ug-heal-v1", "1"); } catch (e) { return; }
            var jobs = [];
            if ("serviceWorker" in navigator) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister().catch(function () {}); }));
              }).catch(function () {}));
            }
            if (window.caches) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k).catch(function () {}); }));
              }).catch(function () {}));
            }
            Promise.all(jobs).then(function () { location.reload(); });
          }, 25000);
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root">
      <!-- Instant boot splash: paints with the HTML itself so a slow network
           never shows a dead white screen while the app bundle downloads.
           React replaces this content when it mounts. -->
      <div id="ug-splash" style="position:fixed;inset:0;background:#0b0b14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#f4f2ff;">

        <div style="font-size:20px;font-weight:700;">UniGenius AI</div>
        <div style="width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#8b5cf6;animation:ugspin 0.9s linear infinite;"></div>
        <div style="font-size:13px;color:#a5a3c0;">Loading… on a slow connection, this may take a moment</div>
        <style>@keyframes ugspin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
